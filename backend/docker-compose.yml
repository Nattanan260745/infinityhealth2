version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # ใช้ Database ที่รันอยู่ใน Docker แทน Neon เพื่อเลี่ยง Firewall
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/infinityhealth?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infinityhealth
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infinityhealth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
