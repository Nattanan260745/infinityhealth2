version: '3.8'

services:
  db:
    image: postgres:15
    container_name: infinityhealth_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: infinityhealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    network_mode: "host"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
