// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
  }
}

ext {
  buildToolsVersion = "35.0.0"
  minSdkVersion = 24
  compileSdkVersion = 35
  targetSdkVersion = 35
  ndkVersion = "27.0.12077973"
  kotlinVersion = "2.0.21"
  
  // Pin versions for react-native-google-fit to avoid D8 errors with 21.5.0+
  authVersion = "20.7.0"
  fitnessVersion = "21.1.0"
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  
  configurations.all {
    resolutionStrategy {
      force "com.google.android.gms:play-services-auth:20.7.0"
      force "com.google.android.gms:play-services-fitness:21.1.0"
      force "com.google.guava:guava:31.1-android"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
